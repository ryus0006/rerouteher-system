services:
  db:
    # pg18 to match the db team's dump (pg_dump 18); pgvector provides vector(384).
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rerouteher
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # pg18 images store data under /var/lib/postgresql (version subdir), not /data.
      - pgdata:/var/lib/postgresql
      # runs on first init only, in order: bootstrap (extension + schema), db-team base
      # schema, db-team data, our E5 account model change (for db-team review), our E6
      # learning data fill, our E9 employer overlay, then finalize (turn FK back on).
      - ./db/00_init_extensions_schemas.sql:/docker-entrypoint-initdb.d/00_init_extensions_schemas.sql:ro
      - ./db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/02_data.sql:/docker-entrypoint-initdb.d/02_data.sql:ro
      - ./db/03_e5_account_model.sql:/docker-entrypoint-initdb.d/03_e5_account_model.sql:ro
      - ./db/04_e6_learning_seed.sql:/docker-entrypoint-initdb.d/04_e6_learning_seed.sql:ro
      - ./db/05_e9_employer_overlay.sql:/docker-entrypoint-initdb.d/05_e9_employer_overlay.sql:ro
      - ./db/06_finalize.sql:/docker-entrypoint-initdb.d/06_finalize.sql:ro
    healthcheck:
      # -h localhost forces a TCP probe. The image runs a temporary socket-only server
      # while it loads the init scripts; a plain pg_isready would report healthy during
      # that phase and the API would start mid-restart (Connection refused). Requiring
      # TCP means "healthy" only fires once the real server accepts connections.
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d rerouteher"]
      interval: 5s
      timeout: 5s
      retries: 10
      # First init loads the 333MB dump before accepting connections; give it room
      # so a slow import is not counted as unhealthy.
      start_period: 600s

  api:
    build: .
    container_name: rerouteher-api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/rerouteher}
      # Set in the Coolify UI (api resource -> Environment Variables) for production.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      # TF-IDF occupation model lives outside the image (produced by the data team)
      - ./ml:/app/ml:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
